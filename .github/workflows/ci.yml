name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE-*']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ADA_TOOLCHAIN: gnat_native=16.1.0 gprbuild=26.0.1
  TOOLCHAIN_KEY: alr2.1.1-gnat16.1.0-gprbuild26.0.1-v1
  ADAMUTANT_COMMIT: f1d064e923fef19c4163328b03daf5a5d53de14a

jobs:
  linux:
    name: Linux (tests and Samba integration)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-toolchain
          key: ada-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}
      - name: Install Ada toolchain
        run: bash .github/scripts/install-ada.sh "$HOME/ada-toolchain" $ADA_TOOLCHAIN
      - name: Install Samba and Python cryptography
        # cryptography is the AES, AES-CMAC, AES-CCM, AES-GCM, KDF and signing comparison tests' reference; test-only.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends samba python3-cryptography
      - name: Strict build, source and stack checks
        run: make check
      - name: Unit tests
        run: make test
      - name: Conformance tests
        run: make crypto-test aes-test cmac-test ccm-test gcm-test kdf-test signing-test ntlm-test unicode-test clock-test
      - name: Transport test
        run: make transport-test
      - name: Samba integration (SMB 2.1, proxy tests)
        # Creates a test-only account and a private smbd on 127.0.0.1:1445.
        run: sudo env "PATH=$PATH" python3 tests/samba_integration.py
      - name: Samba integration (SMB 3.1.1 only, signing required)
        run: sudo env "PATH=$PATH" ADASMB_SMB311_ONLY=1 python3 tests/samba_integration.py
      - name: Samba integration (SMB 3.1.1 only, cipher offered, encryption not required)
        run: sudo env "PATH=$PATH" ADASMB_SMB311_ONLY=1 ADASMB_SMB_ENCRYPT=default python3 tests/samba_integration.py
      - name: Samba integration (SMB 3.1.1 only, encryption required)
        run: sudo env "PATH=$PATH" ADASMB_SMB311_ONLY=1 ADASMB_SMB_ENCRYPT=required python3 tests/samba_integration.py
      - name: Samba integration (SMB 3.1.1 only, encryption required, AES-256-GCM only)
        run: sudo env "PATH=$PATH" ADASMB_SMB311_ONLY=1 ADASMB_SMB_ENCRYPT=required ADASMB_SMB_CIPHER=AES-256-GCM python3 tests/samba_integration.py
      - name: Samba integration (SMB 3.1.1 only, encryption required, AES-256-CCM only)
        run: sudo env "PATH=$PATH" ADASMB_SMB311_ONLY=1 ADASMB_SMB_ENCRYPT=required ADASMB_SMB_CIPHER=AES-256-CCM python3 tests/samba_integration.py

  mutation:
    name: Mutation testing (changed lines)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-toolchain
          key: ada-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}
      - name: Install Ada toolchain
        run: bash .github/scripts/install-ada.sh "$HOME/ada-toolchain" $ADA_TOOLCHAIN
      - name: Build AdaMutant
        run: bash .github/scripts/install-adamutant.sh "$HOME/adamutant" "$ADAMUTANT_COMMIT"
      - name: Install Python cryptography
        # The AES, AES-CMAC, AES-CCM, AES-GCM, KDF and signing comparison tests' reference; a test-only dependency.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cryptography
      - name: Mutate the lines this pull request changes
        run: adamutant run --since "origin/$GITHUB_BASE_REF" --concurrency 4
      - name: Fail on undetected mutants
        run: python3 tests/mutation_survivors.py --fail
      # AdaMutant names the baseline log but does not print it.
      - name: Show the baseline test log
        if: failure()
        run: tail -n 200 .adamutant/logs/baseline-test.log || true
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: .adamutant/reports/
          if-no-files-found: ignore

  windows:
    name: Windows (tests)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-toolchain
          key: ada-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}
      - name: Install Ada toolchain
        run: bash .github/scripts/install-ada.sh "$HOME/ada-toolchain" $ADA_TOOLCHAIN
      - name: Strict build, source and stack checks
        run: |
          for project in smb.gpr smb_tests.gpr smb_example.gpr; do
            gprbuild -p -P "$project" -cargs:Ada -gnatwe
          done
          python tests/check_sources.py
          gprbuild -p -P smb.gpr --subdirs=stack-usage -cargs:Ada -fcallgraph-info=su
          python tests/check_stack_usage.py
      - name: Unit tests
        run: ./build/bin/test_suite.exe
      - name: Windows SMB server integration
        # The runner is a disposable virtual machine whose job is an
        # administrator. The harness adds a test-only local account and
        # share, runs the integration client over SMB 3.1.1 with and without
        # required encryption, and removes them.
        env:
          ADASMB_WINDOWS_SERVER: "1"
        run: python tests/windows_integration.py
      - name: Install Python cryptography
        # The AES, AES-CMAC, AES-CCM, AES-GCM, KDF and signing comparison tests' reference; a test-only dependency.
        run: python -m pip install --disable-pip-version-check cryptography==50.0.2
      - name: Conformance tests
        run: |
          python tests/crypto_conformance.py
          python tests/aes_conformance.py
          python tests/cmac_conformance.py
          python tests/ccm_conformance.py
          python tests/gcm_conformance.py
          python tests/kdf_conformance.py
          python tests/signing_conformance.py
          python tests/ntlm_av_conformance.py
          python tests/ntlm_challenge_fields.py
          python tests/unicode_conformance.py
          python tests/clock_conformance.py
      - name: Transport test
        run: python tests/transport_integration.py

  macos:
    name: macOS (build)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-toolchain
          key: ada-${{ runner.os }}-${{ runner.arch }}-${{ env.TOOLCHAIN_KEY }}
      - name: Install Ada toolchain
        run: bash .github/scripts/install-ada.sh "$HOME/ada-toolchain" $ADA_TOOLCHAIN
      - name: Strict build
        run: |
          gprbuild -p -P smb.gpr -cargs:Ada -gnatwe
          gprbuild -p -P smb_example.gpr -cargs:Ada -gnatwe
