name: Proof

on:
  # After each merge, so that main's proof cache, the one a new pull request
  # starts from, follows main: a pull request can read only its own caches
  # and main's. With the cache, this proves only what the merge changed.
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * 0' # Sunday 18:00 UTC (Monday 03:00 JST)
  workflow_dispatch:

permissions:
  contents: read

# A running proof after a merge is not cancelled by the next merge, so it
# saves main's cache; GitHub still keeps only one waiting run, and a
# scheduled or by-hand run cancels as before.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  prove:
    name: GNATprove (all units)
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-prover
          key: ada-${{ runner.os }}-${{ runner.arch }}-alr2.1.1-gnat16.1.0-gprbuild26.0.1-gnatprove16.1.0-v1
      - name: Install Ada toolchain and GNATprove
        run: >
          bash .github/scripts/install-ada.sh "$HOME/ada-prover"
          gnat_native=16.1.0 gprbuild=26.0.1 gnatprove=16.1.0
      # GNATprove's proof cache: the results of proof goals that have not
      # changed come from it instead of the provers. A branch reads the
      # newest cache of its own or of main, and saves a new one, even after
      # a failed proof, whose finished goals are still worth keeping.
      - name: Restore the proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof-cache
          key: proof-cache-${{ runner.os }}-gnatprove16.1.0-${{ github.sha }}-${{ github.run_id }}
          restore-keys: proof-cache-${{ runner.os }}-gnatprove16.1.0-
      - name: Prove
        run: |
          mkdir -p proof-cache
          du -sh proof-cache
          time make prove PROOF_CACHE=proof-cache
      # Not when cancelled or timed out: a prover stopped while writing
      # leaves an entry cut short, which stops GNATprove when read.
      - name: Save the proof cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof-cache
          key: proof-cache-${{ runner.os }}-gnatprove16.1.0-${{ github.sha }}-${{ github.run_id }}
