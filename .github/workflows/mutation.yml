name: Mutation

on:
  schedule:
    - cron: '0 18 * * 6' # Saturday 18:00 UTC (Sunday 03:00 JST)
  # Run by hand, it can take the files to mutate, in one job, to try
  # something on a few units; by default it mutates every file in 8 shards.
  workflow_dispatch:
    inputs:
      files:
        description: Files to mutate, separated by spaces (all when empty)
        required: false
        default: ''

permissions:
  contents: read

# A run by hand and the weekly run do not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  ADA_TOOLCHAIN: gnat_native=16.1.0 gprbuild=26.0.1
  TOOLCHAIN_KEY: alr2.1.1-gnat16.1.0-gprbuild26.0.1-v1
  ADAMUTANT_COMMIT: d1d049ec74e043351b3395ec31cfc232419873e2

jobs:
  # The proof of each mutant takes the goals it does not change from
  # GNATprove's proof cache, so the project is proved into the cache once,
  # here, and the shards restore that cache.
  prove:
    name: Prove into the proof cache
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-prover
          key: ada-${{ runner.os }}-${{ runner.arch }}-alr2.1.1-gnat16.1.0-gprbuild26.0.1-gnatprove16.1.0-v1
      - name: Install Ada toolchain and GNATprove
        run: >
          bash .github/scripts/install-ada.sh "$HOME/ada-prover"
          gnat_native=16.1.0 gprbuild=26.0.1 gnatprove=16.1.0
      - name: Restore the proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof-cache
          key: proof-cache-${{ runner.os }}-gnatprove16.1.0-${{ github.sha }}-${{ github.run_id }}
          restore-keys: proof-cache-${{ runner.os }}-gnatprove16.1.0-
      # Only the units to mutate, when files are given by hand; a body that
      # proof.gpr does not prove needs no proof.
      - name: Prove
        env:
          FILES: ${{ inputs.files }}
        run: |
          mkdir -p proof-cache
          if [ -n "$FILES" ]; then
            units=$(python3 -c 'import sys; sys.path.insert(0, "tests"); from mutant_low_steps import proved_sources; from pathlib import Path; print(" ".join(sorted({Path(f).name for f in sys.argv[1:]} & proved_sources())))' $FILES)
            if [ -z "$units" ]; then echo "no unit to prove"; exit 0; fi
          else
            units=
          fi
          time make prove PROOF_CACHE=proof-cache PROOF_REPORT=statistics PROOF_UNITS="$units"
      - name: Show the proof steps
        if: always()
        run: python3 tests/proof_steps.py gnatprove.out >> "$GITHUB_STEP_SUMMARY"
      - name: Prove the units to mutate at the low steps limit
        env:
          FILES: ${{ inputs.files }}
        run: python3 tests/mutant_low_steps.py proof-cache ${FILES:---all}
      # Not when cancelled or timed out: a prover stopped while writing
      # leaves an entry cut short, which stops GNATprove when read.
      - name: Save the proof cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof-cache
          key: proof-cache-${{ runner.os }}-gnatprove16.1.0-${{ github.sha }}-${{ github.run_id }}

  mutate:
    name: Mutation testing (shard ${{ matrix.shard }}/8)
    needs: prove
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        # One shard for files given by hand.
        shard: ${{ fromJSON(inputs.files && '[1]' || '[1, 2, 3, 4, 5, 6, 7, 8]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/ada-prover
          key: ada-${{ runner.os }}-${{ runner.arch }}-alr2.1.1-gnat16.1.0-gprbuild26.0.1-gnatprove16.1.0-v1
      - name: Install Ada toolchain and GNATprove
        run: >
          bash .github/scripts/install-ada.sh "$HOME/ada-prover"
          gnat_native=16.1.0 gprbuild=26.0.1 gnatprove=16.1.0
      - name: Build AdaMutant
        run: bash .github/scripts/install-adamutant.sh "$HOME/adamutant" "$ADAMUTANT_COMMIT"
      - name: Install Python cryptography
        # The AES, AES-CMAC, AES-CCM, AES-GCM, KDF and signing comparison tests' reference; a test-only dependency.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-cryptography
      # The prove job saved it under this key; without it every mutant's
      # proof would start cold.
      - name: Restore the proof cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: proof-cache
          key: proof-cache-${{ runner.os }}-gnatprove16.1.0-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true
      - name: Mutate the files of this shard
        env:
          PROOF_CACHE: ${{ github.workspace }}/proof-cache
          FILES: ${{ inputs.files }}
        run: |
          if [ -n "$FILES" ]; then
            files=$(for file in $FILES; do printf -- '--mutate %s ' "$file"; done)
          else
            files=$(python3 tests/mutation_shards.py ${{ matrix.shard }}/8)
          fi
          adamutant run --concurrency 4 $files
      - name: Report
        if: always()
        run: python3 tests/mutation_survivors.py
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report-${{ matrix.shard }}
          path: .adamutant/reports/
          if-no-files-found: ignore
